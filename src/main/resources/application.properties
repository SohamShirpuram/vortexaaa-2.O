spring.application.name=govfix
server.port=${SERVER_PORT:8080}

# Database DataSource configuration
# Defaults to file-based persistent storage in MySQL compatibility mode if DB_URL is not set
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/govfix;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
govfix.upload.dir=./uploads

# H2 Console (available during development/demo at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static resource handling
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
